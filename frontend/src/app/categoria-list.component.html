<div class="container mt-5">
  <div class="row mb-4">
    <div class="col-md-8">
      <h2>Categories</h2>
    </div>
    <div class="col-md-4 text-end">
      <a routerLink="/add" class="btn btn-primary">Add Category</a>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ error }}
    <button type="button" class="btn-close" (click)="error = null"></button>
  </div>

  <div *ngIf="loading" class="alert alert-info">
    Loading categories...
  </div>

  <div *ngIf="!loading && categorias.length === 0 && !error" class="alert alert-warning">
    No categories found. <a routerLink="/add" class="alert-link">Create one</a>
  </div>

  <div *ngIf="!loading && categorias.length > 0" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Books Count</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let categoria of categorias">
          <td>{{ categoria.id }}</td>
          <td>{{ categoria.nome }}</td>
          <td>{{ categoria.descricao }}</td>
          <td><span class="badge bg-info">{{ categoria.livrosCount }}</span></td>
          <td>
            <button 
              class="btn btn-danger btn-sm"
              (click)="deletarCategoria(categoria.id)"
              title="Delete category">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
